name: Daily Market Refresh

# Two jobs a day, split by what each data source needs (scripts/cloud_refresh.py --steps):
#
#   close  22:07 UTC Mon-Fri   market,labels
#          After the 16:15 ET VIX settle in both EDT (20:15 UTC) and EST (21:15 UTC).
#          Yahoo publishes the session's ^GSPC/^VIX/^VIX9D/^VIX3M/^VIX6M/^VVIX/^IRX bars
#          within minutes of the close and keeps their full history, so nothing here
#          races a "rollover" (the August 2026 outage was the exclusive yfinance end
#          date, fixed in 236509e). Commits the labels and the market partitions.
#
#   book   01:30 UTC Tue-Sat   market,calibrate,freeze   (+ retry 03:30 UTC)
#          The SPX option chain needs live two-sided quotes. After 16:15 ET Cboe's book
#          is empty until Global Trading Hours open at 20:15 ET (00:15 UTC under EDT,
#          01:15 UTC under EST); Friday evening keeps the closing book, hence Saturday
#          UTC. A mistimed run fails closed at the quote-state gate. The retry is free:
#          a session whose calibration already exists is skipped ("exists").
#
# GitHub starts scheduled runs late under load (87-139 min for the old :00 slot in
# Sep 2026; the top of the hour is the worst time), so the close slot sits off the hour.
# The concurrency group serialises the slots and manual runs; the push rebases and
# retries if main moved during the run.
on:
  schedule:
    - cron: "7 22 * * 1-5"     # close
    - cron: "30 1 * * 2-6"     # book
    - cron: "30 3 * * 2-6"     # book, retry
  workflow_dispatch:
    inputs:
      steps:
        description: "cloud_refresh.py --steps (any of market,labels,calibrate,freeze)"
        default: "market,calibrate,freeze"
        type: string

permissions:
  contents: write              # commit data back to main and push gh-pages

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh data + redeploy site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"    # keep print/log lines in step order in the job log

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false   # no write token in .git/config while PyPI code runs

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # The exact set tests.yml tests. torch is the CPU wheel: the daily path needs it
      # (freezing /backtest unpickles TradeRecord, whose import chain reaches
      # models/nn_pricer.py, which imports torch at module level), but not CUDA.
      - name: Install dependencies (locked)
        run: python -m pip install -r requirements-lock.txt

      - name: Choose steps
        id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_STEPS: ${{ inputs.steps }}
        run: |
          case "$SCHEDULE" in
            "7 22 * * 1-5") steps="market,labels"; slot="close" ;;
            "")             steps="${INPUT_STEPS:-market,calibrate,freeze}"; slot="manual" ;;
            *)              steps="market,calibrate,freeze"; slot="book" ;;
          esac
          if ! [[ "$steps" =~ ^[a-z,]+$ ]]; then echo "::error::bad steps '$steps'"; exit 1; fi
          echo "steps=$steps" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "Slot: $slot -> steps: $steps"

      - name: Run cloud_refresh.py
        id: refresh
        env:
          STEPS: ${{ steps.plan.outputs.steps }}
        run: python scripts/cloud_refresh.py --steps "$STEPS"

      # Publish-path tests against the data this run produced (the suite works on a
      # private copy of data_store and fails if anything under data_store/ changes).
      - name: Fast tests before publishing
        id: tests
        if: always() && steps.refresh.outcome != 'skipped'
        working-directory: joint_vol_calibration/tests
        run: >
          python -m pytest -q -p no:cacheprovider
          test_suite_isolation.py test_infra_config.py test_cloud_refresh.py test_data_layer.py
          test_option_chain.py test_data_pipeline.py test_rates.py test_lookahead.py
          test_c21_audit_fixes.py test_dashboard.py

      - name: Upload run status and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: refresh-${{ github.run_id }}-${{ steps.plan.outputs.slot }}
          path: |
            .refresh-status.json
            data_store/parquet/diag_*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      # Committed even when the refresh exits 1 (e.g. a stale calibration): what it
      # did capture is valid, and a failed download or rejected fit writes nothing.
      # vol_system.db is a rebuildable cache and is not committed; the parquet
      # captures under data_store/market and data_store/options are the record.
      - name: Commit data files
        id: commit
        if: always() && steps.refresh.outcome != 'skipped' && steps.tests.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SLOT: ${{ steps.plan.outputs.slot }}
          SESSION: ${{ steps.refresh.outputs.session }}
          CALIBRATION: ${{ steps.refresh.outputs.calibration }}
          REASON: ${{ steps.refresh.outputs.reason }}
          LABELS_ADDED: ${{ steps.refresh.outputs.labels_added }}
          PERSISTED: ${{ steps.refresh.outputs.persisted }}
          HEADLINE: ${{ steps.refresh.outputs.headline_calibration }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data_store/signals/regime_labels.parquet data_store/market \
                   data_store/options data_store/calibrations; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            title="Auto-refresh session ${SESSION:-unknown} (${SLOT}): labels +${LABELS_ADDED:-0}; calibration ${CALIBRATION:-not-run}"
            body="Capture files changed: ${PERSISTED:-0}. Headline calibration: ${HEADLINE:-none}."
            [ -n "$REASON" ] && [ "$REASON" != "ok" ] && body="$body Calibration reason: $REASON"
            git commit -q -m "$title" -m "$body" -m "Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
            auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            pushed=0
            for i in 1 2 3 4; do
              if git -c http.https://github.com/.extraheader="$auth" push origin HEAD:main; then
                pushed=1; break
              fi
              echo "Push rejected (attempt $i); rebasing onto origin/main"
              sleep $((i * 10))
              git -c http.https://github.com/.extraheader="$auth" pull --rebase origin main || {
                git rebase --abort || true; echo "::error::rebase onto main failed"; exit 1; }
            done
            [ "$pushed" = 1 ] || { echo "::error::push to main failed after 4 attempts"; exit 1; }
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        if: >
          steps.refresh.outcome == 'success' && steps.tests.outcome == 'success' &&
          steps.commit.outcome == 'success' && contains(steps.plan.outputs.steps, 'freeze')
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_dir: .site-build
          publish_branch: gh-pages
          force_orphan: false            # preserve gh-pages history
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          full_commit_message: >-
            Deploy session ${{ steps.refresh.outputs.session }} from
            ${{ steps.commit.outputs.sha }} (calibration ${{ steps.refresh.outputs.calibration }};
            run ${{ github.run_id }})
          cname: navnoorbawa.me          # preserve custom domain
