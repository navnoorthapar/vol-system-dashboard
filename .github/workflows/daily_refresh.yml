name: Daily Market Refresh

# Two jobs a day, split by what each data source needs (scripts/cloud_refresh.py --steps):
#
#   close  22:07 UTC Mon-Fri   market,labels
#          After the 16:15 ET VIX settle in both EDT (20:15 UTC) and EST (21:15 UTC).
#          Yahoo publishes the session's ^GSPC/^IRX bars within minutes of the close.
#          The VIX index family (^VIX9D/^VIX/^VIX3M/^VIX6M/^VVIX) is Cboe's official
#          files; a session Cboe has not posted yet keeps Yahoo's row as provisional
#          (source 'yfinance') until a later run (the book slot runs `market` again)
#          stores Cboe's print over it. The Treasury bill/par files and NY Fed SOFR
#          feed rates_daily, the discount curve (stale after 7 days by design).
#          Commits the labels and the market partitions (rates_daily included).
#
#   book   02:30 UTC Tue-Sat   market,capture,calibrate,freeze   (+ retry 04:30 UTC)
#          The SPX option chain needs live two-sided quotes. After 16:15 ET Cboe's book
#          is empty until Global Trading Hours open at 20:15 ET (00:15 UTC under EDT,
#          01:15 UTC under EST); Friday evening keeps the closing book, hence Saturday
#          UTC. 02:30 UTC leaves 75 min after the EST open for Yahoo's ~15-min delayed
#          quotes (01:30 left 15 min); GTH runs to 09:15 ET, so a late start is still
#          inside the live book. A mistimed run fails closed at the quote-state gate.
#          `capture` stores Cboe's full delayed SPX and VIX books (data_store/options/
#          cboe/), whatever the fit does. After an accepted fit the run records the
#          forward ledger and rebuilds the session's surface report and diagnostics and
#          the headline fit's Greeks surface and scenario grid (about 5 min).
#          The retry skips what already exists (a calibration, a capture), but it is a
#          full job: install, market step, freeze.
#
# GitHub starts scheduled runs late under load (87-319 min, median 127, for the old :00
# slot in Sep-Oct 2026; the top of the hour is the worst time), so the slots sit off the
# hour. The concurrency group serialises the slots and manual runs; each push rebases
# and retries if main moved during the run (scripts/ci/commit_and_push.sh).
on:
  schedule:
    - cron: "7 22 * * 1-5"     # close
    - cron: "30 2 * * 2-6"     # book
    - cron: "30 4 * * 2-6"     # book, retry
  workflow_dispatch:
    inputs:
      steps:
        description: "cloud_refresh.py --steps (any of market,labels,capture,calibrate,freeze)"
        default: "market,capture,calibrate,freeze"
        type: string

permissions:
  contents: write              # commit data back to main and push gh-pages

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh data + redeploy site
    runs-on: ubuntu-latest
    timeout-minutes: 45          # an accepted fit adds ~5 min of diagnostics and artifacts
    env:
      PYTHONUNBUFFERED: "1"    # keep print/log lines in step order in the job log

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false   # no write token in .git/config while PyPI code runs

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # The exact set tests.yml tests. torch is the CPU wheel: the daily path needs it
      # (freezing /backtest unpickles TradeRecord, whose import chain reaches
      # models/nn_pricer.py, which imports torch at module level), but not CUDA.
      - name: Install dependencies (locked)
        run: python -m pip install -r requirements-lock.txt

      - name: Choose steps
        id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_STEPS: ${{ inputs.steps }}
        run: |
          case "$SCHEDULE" in
            "7 22 * * 1-5") steps="market,labels"; slot="close" ;;
            "")             steps="${INPUT_STEPS:-market,capture,calibrate,freeze}"; slot="manual" ;;
            *)              steps="market,capture,calibrate,freeze"; slot="book" ;;
          esac
          if ! [[ "$steps" =~ ^[a-z,]+$ ]]; then echo "::error::bad steps '$steps'"; exit 1; fi
          echo "steps=$steps" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "Slot: $slot -> steps: $steps"

      - name: Run cloud_refresh.py
        id: refresh
        env:
          STEPS: ${{ steps.plan.outputs.steps }}
        run: python scripts/cloud_refresh.py --steps "$STEPS"

      # Everything this run created or changed under the record's directories leaves
      # the runner first, before any gate or push can fail: on 2026-10-19, -20 and
      # -21 a failed gate skipped the only commit and the run artifact held the
      # status JSON alone (1.3 KB), so three overnight books were lost with the
      # runner. 90 days; recovery is in the annotation of the last step.
      - name: Bundle this run's captures
        id: bundle
        if: always() && steps.refresh.outcome != 'skipped'
        run: |
          b="$RUNNER_TEMP/captures"
          rm -rf "$b" && mkdir -p "$b"
          git ls-files -z --others --modified --exclude-standard -- \
            data_store/options data_store/calibrations data_store/forward data_store/market \
            data_store/signals ':(exclude)data_store/calibrations/diagnostics' > "$RUNNER_TEMP/captures.lst"
          n=0
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            mkdir -p "$b/$(dirname "$f")" && cp -p "$f" "$b/$f" && n=$((n + 1))
          done < "$RUNNER_TEMP/captures.lst"
          [ -f .refresh-status.json ] && cp -p .refresh-status.json "$b/"
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "$n file(s) this run created or changed, bundled for upload"

      - name: Upload the captures (before the gates)
        if: always() && steps.bundle.outcome == 'success' && steps.bundle.outputs.n != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: captures-${{ github.run_id }}-${{ steps.plan.outputs.slot }}
          path: ${{ runner.temp }}/captures
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90

      # The files a later run cannot fetch again (the Cboe books, the accepted SPX
      # chain, the fit, the forward ledger) are new files: they go in a commit of
      # their own, first, behind integrity checks only (scripts/ci/check_captures.py:
      # each is read back whole), never behind the test gates. New paths cannot
      # conflict on a rebase, so this commit lands even when main moved; a failed
      # push is retried (scripts/ci/commit_and_push.sh). Anything else waits for
      # the data gate below.
      - name: Check the captures (integrity only)
        id: capturecheck
        if: always() && steps.refresh.outcome != 'skipped'
        run: python scripts/ci/check_captures.py --out "$RUNNER_TEMP/captures.ok"

      - name: Commit captures
        id: commitcaptures
        if: always() && steps.refresh.outcome != 'skipped' && steps.capturecheck.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SLOT: ${{ steps.plan.outputs.slot }}
          SESSION: ${{ steps.refresh.outputs.session }}
          CALIBRATION: ${{ steps.refresh.outputs.calibration }}
        run: |
          [ -f "$RUNNER_TEMP/captures.ok" ] || { echo "::error::the capture check wrote no list"; exit 1; }
          mapfile -t files < "$RUNNER_TEMP/captures.ok"
          if [ "${#files[@]}" -eq 0 ]; then echo "No new captures."; exit 0; fi
          scripts/ci/commit_and_push.sh \
            "Auto-refresh session ${SESSION:-unknown} (${SLOT}): captures" \
            "${#files[@]} new capture file(s) (Cboe books, accepted chain, fit, forward ledger); calibration ${CALIBRATION:-not-run}." \
            "${files[@]}"

      # Tests against the data this run produced (the suite works on a private copy of
      # data_store and fails if anything under data_store/ changes), in three gates.
      # The data gate decides whether the re-derivable record (labels, market
      # partitions) is committed, the artifact gate whether the artifacts derived
      # from a new fit are, and the presentation gate only whether the site is
      # deployed. They used to be one gate, so on 2026-10-20 two dashboard copy tests
      # failed on a legitimately new fit and the accepted overnight (GTH) book of
      # 2026-10-19, which cannot be fetched again, was never committed; the captures
      # now go first, above, behind integrity checks only. A rendering bug, or a
      # derived artifact that fails its checks, may block a deploy; it must never
      # lose data. None of these gates may pin a value the bot replaces
      # (scripts/ci/simulate_next_session.py checks that in CI).
      - name: Data tests (gate the capture commit)
        id: datatests
        if: always() && steps.refresh.outcome != 'skipped'
        working-directory: joint_vol_calibration/tests
        run: >
          python -m pytest -q -p no:cacheprovider
          test_suite_isolation.py test_infra_config.py test_cloud_refresh.py test_data_layer.py
          test_option_chain.py test_data_pipeline.py test_rates.py test_lookahead.py
          test_c21_audit_fixes.py test_cboe_downloader.py test_forward_ledger.py

      - name: Artifact tests (gate the artifact commit)
        id: artifacttests
        if: always() && steps.refresh.outcome != 'skipped'
        working-directory: joint_vol_calibration/tests
        run: python -m pytest -q -p no:cacheprovider test_session_artifacts.py test_scenario_grid.py

      - name: Presentation tests (gate the deploy)
        id: tests
        if: always() && steps.refresh.outcome != 'skipped'
        working-directory: joint_vol_calibration/tests
        run: python -m pytest -q -p no:cacheprovider test_dashboard.py

      - name: Upload run status and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: refresh-${{ github.run_id }}-${{ steps.plan.outputs.slot }}
          path: |
            .refresh-status.json
            data_store/parquet/diag_*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      # Committed even when the refresh exits 1 (e.g. a stale calibration or a failed
      # derived artifact): what it did capture is valid, and a failed download or
      # rejected fit writes nothing. The record: labels, market partitions
      # (rates_daily included), and any capture the commit above did not take (its
      # second chance). data_store/vol_system.db is git-tracked, but the bot never
      # commits it: it is a rebuildable cache (every run first restores the committed
      # parquet captures under data_store/market and data_store/options into it).
      # Every run modifies it, so it is an unstaged change here and the rebase in the
      # push loop must --autostash it: a plain `git pull --rebase` refuses ("You have
      # unstaged changes") and the run lost its captures whenever main had moved.
      # The partitions and the labels are binary files main may also have changed (a
      # PR merge, a data fix): on such a rebase conflict the push loop takes main's
      # version and re-derives them from this run's database (REDERIVE:
      # cloud_refresh.py --rederive) instead of dropping the commit.
      - name: Commit data files
        id: commit
        if: always() && steps.refresh.outcome != 'skipped' && steps.datatests.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SLOT: ${{ steps.plan.outputs.slot }}
          SESSION: ${{ steps.refresh.outputs.session }}
          CALIBRATION: ${{ steps.refresh.outputs.calibration }}
          REASON: ${{ steps.refresh.outputs.reason }}
          LABELS_ADDED: ${{ steps.refresh.outputs.labels_added }}
          PERSISTED: ${{ steps.refresh.outputs.persisted }}
          HEADLINE: ${{ steps.refresh.outputs.headline_calibration }}
          STEPS: ${{ steps.plan.outputs.steps }}
          RUN_UTC: ${{ steps.refresh.outputs.run_utc }}
        run: |
          export REDERIVE="python scripts/cloud_refresh.py --rederive --steps '$STEPS' --now '$RUN_UTC'"
          title="Auto-refresh session ${SESSION:-unknown} (${SLOT}): labels +${LABELS_ADDED:-0}; calibration ${CALIBRATION:-not-run}"
          body="Capture files changed: ${PERSISTED:-0}. Headline calibration: ${HEADLINE:-none}."
          [ -n "$REASON" ] && [ "$REASON" != "ok" ] && body="$body Calibration reason: $REASON"
          scripts/ci/commit_and_push.sh "$title" "$body" \
            data_store/signals/regime_labels.parquet data_store/market data_store/options \
            data_store/calibrations ':(exclude)data_store/calibrations/diagnostics' data_store/forward

      # What derives from a new fit (cloud_refresh.refresh_session_artifacts): the
      # session's surface report and diagnostics, the headline fit's Greeks surface and
      # scenario grid. A separate commit behind its own gate, after the captures, so an
      # artifact that fails its checks is reported and left out, never the data.
      - name: Commit derived artifacts
        id: commitartifacts
        if: >
          always() && steps.refresh.outcome != 'skipped' && steps.commit.outcome == 'success' &&
          steps.artifacttests.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SESSION: ${{ steps.refresh.outputs.session }}
        run: |
          scripts/ci/commit_and_push.sh \
            "Auto-refresh session ${SESSION:-unknown}: derived artifacts" \
            "Surface report, calibration diagnostics, Greeks surface and scenario grid of the new fit (and any an earlier run failed to build: the backfill)." \
            data_store/surface data_store/calibrations/diagnostics data_store/greeks

      # The captures went into the artifact above; this says so when neither commit
      # took them, instead of a silently skipped step.
      - name: Report captures that were not committed
        if: >
          always() && steps.bundle.outputs.n != '' && steps.bundle.outputs.n != '0' &&
          (steps.commitcaptures.outcome != 'success' || steps.capturecheck.outcome != 'success') &&
          steps.commit.outcome != 'success'
        env:
          SESSION: ${{ steps.refresh.outputs.session }}
          ARTIFACT: captures-${{ github.run_id }}-${{ steps.plan.outputs.slot }}
        run: |
          echo "::error title=Captures not committed::session ${SESSION:-unknown}: this run's captures are NOT on main. They are in the workflow artifact $ARTIFACT (90 days): download it, copy its data_store/ over a checkout of main, commit and push."
          exit 1

      # A stale calibration fails the job (exit 1) but does not block the deploy: the
      # site states the headline fit's age in its staleness banner. cloud_refresh sets
      # publishable=false for what must block it (freeze failed, market data not
      # current, captures not restored/persisted). The site is rendered from this run's
      # tree, so it deploys only once both commits hold what it shows.
      - name: Deploy to GitHub Pages
        if: >
          always() && steps.refresh.outputs.publishable == 'true' &&
          steps.datatests.outcome == 'success' && steps.tests.outcome == 'success' &&
          steps.commit.outcome == 'success' && steps.commitartifacts.outcome == 'success' &&
          contains(steps.plan.outputs.steps, 'freeze')
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_dir: .site-build
          publish_branch: gh-pages
          force_orphan: false            # preserve gh-pages history
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          full_commit_message: >-
            Deploy session ${{ steps.refresh.outputs.session }} from
            ${{ steps.commitartifacts.outputs.sha }} (calibration ${{ steps.refresh.outputs.calibration }};
            run ${{ github.run_id }})
          cname: navnoorbawa.me          # preserve custom domain
