name: tests

# The full pytest suite, with coverage, on every push and PR to main. Pushes made by
# the daily bot use GITHUB_TOKEN and do not trigger this workflow, so a weekly run
# also tests main as the bot left it (the daily job runs the publish-path subset
# itself before it commits or deploys).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # Same pinned set as the daily job (CPU torch, xgboost-cpu).
      - name: Install dependencies (locked)
        run: python -m pip install -r requirements-lock.txt

      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 --output-format=github .

      - name: Run test suite with coverage
        run: >
          python -m pytest
          --cov --cov-report=term-missing:skip-covered
          --cov-report=xml:"$RUNNER_TEMP/coverage.xml"
          --junitxml="$RUNNER_TEMP/junit.xml"

      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            { echo "## Coverage"; python -m coverage report --format=markdown --skip-covered; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Render the static site
        run: python dashboard/freeze_site.py "$RUNNER_TEMP/site"

      # The suite works on a private copy of data_store (tests/conftest.py); nothing
      # it or the render does may change a tracked file.
      - name: Working tree is clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Upload coverage, test report and rendered site
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tests-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/coverage.xml
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/site
          if-no-files-found: ignore
          retention-days: 14
