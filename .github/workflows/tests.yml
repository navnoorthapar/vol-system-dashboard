name: tests

# The full pytest suite, with coverage, on every push and PR to main, plus the
# lint/type gates, a benchmark smoke run, the accessibility gate on the frozen
# site, a vulnerability report and the next-session simulation (the daily bot's
# run and gates on a new fit, so no test pins a value the bot replaces). Pushes made by the daily bot use
# GITHUB_TOKEN and do not trigger this workflow, so a weekly run also tests
# main as the bot left it (the daily job runs the publish-path subset itself
# before it commits or deploys). The weekly run also gives the property tests
# 10x their examples (random) and rebuilds the committed artifacts
# (make reproduce).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ci: derandomized (the same examples every run); thorough: 10x, random
      HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'thorough' || 'ci' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # Same pinned set as the daily job (CPU torch, xgboost-cpu).
      - name: Install dependencies (locked)
        run: python -m pip install -r requirements-lock.txt

      # The property tests skip without Hypothesis; in CI a missing tool must
      # fail, not silently skip them.
      - name: Test tools are installed
        run: python -c "import hypothesis, pytest_benchmark; print('hypothesis', hypothesis.__version__)"

      - name: Run test suite with coverage
        run: >
          python -m pytest
          --cov --cov-report=term-missing:skip-covered
          --cov-report=xml:"$RUNNER_TEMP/coverage.xml"
          --junitxml="$RUNNER_TEMP/junit.xml"
          --hypothesis-show-statistics

      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            { echo "## Coverage (statements and branches)"; python -m coverage report --format=markdown --skip-covered; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Render the static site
        run: python dashboard/freeze_site.py "$RUNNER_TEMP/site"

      # The suite works on a private copy of data_store (tests/conftest.py); nothing
      # it or the render does may change a tracked file.
      - name: Working tree is clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Upload coverage, test report and rendered site
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tests-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/coverage.xml
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/site
          if-no-files-found: ignore
          retention-days: 14

  # The 2026-10-20 incident class: tests that pinned committed values passed on the
  # PR and failed inside the bot on the first new fit, which lost that session's
  # captures. scripts/ci/simulate_next_session.py runs the bot's book slot offline on
  # a copy of this checkout (a new session, an accepted fit, the forward ledger and
  # every derived artifact), then the bot's three gates and the whole suite there.
  simulate:
    name: next-session simulation (the bot's gates on a new fit)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies (locked)
        run: python -m pip install -r requirements-lock.txt

      - name: Simulate the next session, then the gates and the full suite
        run: python scripts/ci/simulate_next_session.py --full --out "$RUNNER_TEMP/sim"

      - name: Report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/sim/report.md" ]; then
            { echo "## Next-session simulation"; cat "$RUNNER_TEMP/sim/report.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the simulation's status and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: simulate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sim/report.md
            ${{ runner.temp }}/sim/status.json
            ${{ runner.temp }}/sim/logs
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: lint and type gates (ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies (locked)
        run: python -m pip install -r requirements-lock.txt

      # Always a bug, and clean: annotated inline on the PR.
      - name: Syntax errors and undefined names
        run: python -m ruff check --select E9,F63,F7,F82 --output-format=github .

      # Broad rule set and mypy, each against its committed baseline: a (file,
      # code) count may not grow; implied_vol.py and option_chain.py are strict.
      - name: Lint gate (ruff vs scripts/ci/ruff_baseline.json)
        run: python scripts/ci/baseline_gate.py ruff

      - name: Type gate (mypy vs scripts/ci/mypy_baseline.json)
        run: python scripts/ci/baseline_gate.py mypy

      # The two gates above compare the code with the baseline committed next to
      # it, so a change that adds findings and re-baselines (--update
      # --allow-growth, or a hand edit) passes them. The baselines themselves are
      # compared with the base branch's (the pull request's base, or the push's
      # previous tip): a count may fall, never rise, unless the pull request is
      # labelled 're-baseline' (a reviewed tool upgrade; the growth is printed).
      - name: Check out the base branch's baselines
        id: basebaselines
        if: >
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
          path: .baseline-base
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: true

      - name: Baselines may only shrink (vs the base branch)
        if: steps.basebaselines.outcome == 'success'
        env:
          RE_BASELINE: ${{ contains(github.event.pull_request.labels.*.name, 're-baseline') }}
        run: |
          allow=""
          [ "$RE_BASELINE" = "true" ] && allow="--allow-growth"
          rc=0
          for tool in ruff mypy; do
            python scripts/ci/baseline_gate.py "$tool" \
              --against ".baseline-base/scripts/ci/${tool}_baseline.json" $allow || rc=1
          done
          exit $rc

  bench:
    name: benchmark smoke (no timings asserted)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies (locked)
        run: python -m pip install -r requirements-lock.txt

      # The benchmark files skip without the plugin; here that must fail.
      - name: pytest-benchmark is installed
        run: python -c "import pytest_benchmark"

      # Each benchmark body runs once and checks that it computes the right
      # thing (prices, recomputed loss, C++ kernel parity); shared runners are
      # too noisy for timings, which come from `make bench` (docs/benchmarks.md).
      - name: Benchmarks, one pass each
        run: python -m pytest scripts/bench -p no:cacheprovider --benchmark-disable -m "not slow" -q -rs

  a11y:
    name: accessibility (axe-core, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies (locked)
        run: python -m pip install -r requirements-lock.txt

      - name: Render the static site
        run: python dashboard/freeze_site.py "$RUNNER_TEMP/site"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/ci/a11y/package-lock.json

      - name: Install Playwright and axe-core (locked)
        working-directory: scripts/ci/a11y
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # WCAG 2.0/2.1/2.2 A+AA at 1440 and 390 px in both colour schemes, no
      # horizontal scroll from 320 to 1920 px, no JS errors, no other origins.
      - name: Accessibility and layout gate
        run: node scripts/ci/a11y/a11y.mjs "$RUNNER_TEMP/site" --out "$RUNNER_TEMP/a11y.json"

      # What a reader sees once desk.js has run, under the published CSP: signed
      # bars in the colour of their sign, KPI tones, the '?' dialog centred.
      - name: Interaction gate
        if: always()
        run: node scripts/ci/a11y/interact.mjs "$RUNNER_TEMP/site" --out "$RUNNER_TEMP/interact.json"

      - name: Upload the a11y report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: a11y-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/a11y.json
            ${{ runner.temp }}/interact.json
          if-no-files-found: ignore
          retention-days: 14

  audit:
    name: known vulnerabilities (pip-audit, report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      # Audits the pinned names and versions against the PyPI/OSV advisory
      # database without installing them; findings go to the job summary and
      # do not fail the workflow (the fix is a lock bump, reviewed separately).
      - name: pip-audit on requirements-lock.txt
        run: |
          python -m pip install "pip-audit==2.10.1"
          python -m pip_audit -r requirements-lock.txt --no-deps --disable-pip \
            --progress-spinner off --format markdown > "$RUNNER_TEMP/audit.md" || true
          { echo "## pip-audit (requirements-lock.txt)"; cat "$RUNNER_TEMP/audit.md"; } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/audit.md"

  # The curated mutants (scripts/ci/mutation_check.py) against the property and
  # Jacobian tests. Weekly, like reproduce: ~10 min. A mutant whose site is no
  # longer unique is "stale" and fails the job (it went unnoticed for C23 while
  # the target ran nowhere); tests/test_ci_tools.py also checks the sites on
  # every push.
  mutation:
    name: mutants against the property tests (make mutation)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies (locked)
        run: python -m pip install -r requirements-lock.txt

      - name: Mutants (make mutation)
        run: |
          set -o pipefail
          make mutation | tee "$RUNNER_TEMP/mutation.md"

      - name: Report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mutation.md" ]; then
            { echo "## Mutation check"; grep -E '^\|| mutants killed' "$RUNNER_TEMP/mutation.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi

  reproduce:
    name: rebuild committed artifacts (make reproduce)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies (locked)
        run: python -m pip install -r requirements-lock.txt

      - name: Rebuild in a scratch copy and diff against the committed artifacts
        run: make reproduce OUT="$RUNNER_TEMP/reproduce"

      - name: Report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/reproduce/report.md" ]; then
            cat "$RUNNER_TEMP/reproduce/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the reproduction report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: reproduce-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reproduce/report.md
            ${{ runner.temp }}/reproduce/report.json
            ${{ runner.temp }}/reproduce/logs
          if-no-files-found: ignore
          retention-days: 30
